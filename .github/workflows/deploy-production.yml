# Production deployment to Vercel, gated on CI.
#
# Vercel's Git integration builds Preview deployments for pull requests. Automatic production
# deployments from `main` are disabled in vercel.json (git.deploymentEnabled.main = false), so
# production only changes through this workflow, which runs after the CI workflow succeeds on
# a push to main (or on manual dispatch from main, after re-checking CI for that commit).
#
# Steps: verify CI → verify required Vercel env vars exist (names only) → build → deploy a
# production candidate WITHOUT assigning the domain → smoke-test /api/health on the candidate
# → promote the candidate to the production domain.
#
# A preflight job (no environment) checks credentials and CI first. The deploy job — the only one
# that opens the `production` environment and creates a GitHub deployment record — runs only
# when preflight passes. Until VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are configured
# as repository secrets, preflight ends with a notice and nothing is deployed or recorded.
name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  VERCEL_CLI: vercel@62.2.0
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  preflight:
    name: Preflight
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Resolve commit
        id: sha
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Check deployment credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::notice title=Production deploy skipped::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets are not configured. See README → Continuous deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm required CI checks passed for this commit
        if: steps.creds.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOY_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          for check in "Typecheck, lint & unit tests" "Build & end-to-end"; do
            conclusion=$(gh api "repos/$REPO/commits/$DEPLOY_SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$check\")] | sort_by(.completed_at) | last | .conclusion")
            echo "$check: ${conclusion:-missing}"
            if [ "$conclusion" != "success" ]; then
              echo "::error::Required check \"$check\" has not passed for $DEPLOY_SHA."
              exit 1
            fi
          done

  deploy:
    name: Deploy to Vercel production
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.promote.outputs.url }}
    # Secrets are scoped to the individual steps that call the Vercel CLI, so dependency
    # install scripts (npm ci) never see VERCEL_TOKEN.
    env:
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production environment variables (names only)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes "$VERCEL_CLI" env ls production --token "$VERCEL_TOKEN" | node scripts/ci/check-vercel-env.mjs

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes "$VERCEL_CLI" pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes "$VERCEL_CLI" build --prod --token "$VERCEL_TOKEN"

      - name: Deploy production candidate (domain not yet assigned)
        id: candidate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Candidate: $url"

      - name: Smoke-test candidate
        env:
          CANDIDATE: ${{ steps.candidate.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # Optional: lets the smoke test reach a candidate behind Vercel Deployment Protection.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        # Secrets never appear on a command line or in the log: the bypass secret goes in a header
        # (curl reads it from stdin via -H @-), the CLI reads VERCEL_TOKEN from the environment,
        # and the CLI's own output (which can mention a generated bypass) goes to a file that is
        # only shown with long tokens redacted.
        run: |
          set +x
          err=$(mktemp)
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            body=$(printf 'x-vercel-protection-bypass: %s\n' "$VERCEL_AUTOMATION_BYPASS_SECRET" |
              curl --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-redirs 0 -H @- -w '\n%{http_code}' "$CANDIDATE/api/health" 2>"$err") || true
            status=${body##*$'\n'}; body=${body%$'\n'*}
          else
            # `vercel curl` handles Deployment Protection itself; arguments after `--` go to curl.
            body=$(npx --yes "$VERCEL_CLI" curl /api/health --deployment "$CANDIDATE" --yes -- \
              --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors --max-redirs 0 -w '\n%{http_code}' 2>"$err") || true
            status=${body##*$'\n'}; body=${body%$'\n'*}
          fi
          if [ "$status" != "200" ]; then
            echo "::error title=Candidate smoke test failed::GET /api/health returned HTTP ${status:-none}."
            case "$status" in
              401|403) echo "::error::The candidate is still behind Vercel Deployment Protection or SSO (the bypass was not accepted)." ;;
              30*) echo "::error::The candidate redirected (likely to Vercel authentication) instead of serving the app." ;;
            esac
            sed -E 's/[A-Za-z0-9_-]{24,}/[redacted]/g' "$err" | tail -n 20
            exit 1
          fi
          case "$body" in
            "{"*) ;;
            *) echo "::error title=Candidate smoke test failed::/api/health did not return JSON (protection or error page?)."; exit 1 ;;
          esac
          printf '%s' "$body" | node scripts/ci/check-health.mjs

      - name: Promote candidate to production
        id: promote
        env:
          CANDIDATE: ${{ steps.candidate.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes "$VERCEL_CLI" promote "$CANDIDATE" --yes --token "$VERCEL_TOKEN"
          echo "url=${PRODUCTION_URL:-$CANDIDATE}" >> "$GITHUB_OUTPUT"

      - name: Verify production domain
        if: env.PRODUCTION_URL != ''
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$PRODUCTION_URL/api/health" | node scripts/ci/check-health.mjs
